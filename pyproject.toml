[project]
name = "thebrainrot-blog"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Luis Schuimer", email = "85784931+LuisSchuimer@users.noreply.github.com" }
]
dependencies = [
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "pytest-check>=2.9.1",
    "pytailwindcss>=0.3.1",
    "peewee>=4.5.3",
    "dotenv>=0.9.9",
    "pyjwt>=2.15.1",
]
readme = "README.md"
requires-python = ">= 3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
dev-dependencies = []


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/thebrainrot_blog"]
