[project]
name = "thebrainrot-blog"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Luis Schuimer", email = "85784931+LuisSchuimer@users.noreply.github.com" }
]
dependencies = [
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "pytest-check>=2.9.1",
    "pytailwindcss>=0.3.1",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.rye.scripts]
"thebrainrot-blog" = "rye run python -m thebrainrot_blog.main"
"parser" = "rye run python -m thebrainrot_blog.markdown_handler.parse_markdown"
"parser-test" = "rye run python -m unittest thebrainrot_blog.tests.parser_test -v"
"renderer-test" = "rye run python -m unittest thebrainrot_blog.tests.renderer_test -v"
"css-watch" = "rye run tailwindcss -i src/thebrainrot_blog/static/css/input.css -o src/thebrainrot_blog/static/css/output.css --watch"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/thebrainrot_blog"]
