<div class="mx-auto grid sm:grid-cols-2 gap-4 p-8 justify-items-center">
{% for post in posts %}

    <div class="w-full max-w-sm h-full rounded overflow-hidden shadow-2xl">
        <div class="h-full px-4 py-4 bg-neutral-50">
            <div class="font-medium text-xl"><a href="{{ url_for("show_post_mask", id=post.id) }}">{{ post.title }}</a></div>
            <div class="font-medium text-sm">By {{ post.author }}</div>
            <p class="text-gray-600 text-base">
                {{ post.abstract }}
            </p>
        </div>
    </div>

{% endfor %}
</div>
