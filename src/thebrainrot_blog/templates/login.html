<!DOCTYPE html>
<html>
    {% include "components/headers_component.html" %}

    <body class="bg-neutral-100 flex flex-col">
        {% include "components/navbar_component.html" %}

        <div class="mx-auto my-auto px-8 py-8 bg-neutral-50 rounded-xl shadow-xl items-center">
            <h1 class="text-center font-bold text-lg pb-2">Admin Login</h1>

            {% if login_fail %}<p class="text-red-500 text-sm">Login failed</p>{% endif %}

            <form action="{{ url_for("login") }}", method="post" class="flex flex-col items-center">
                <label for="password" class="font-semibold">Password: </label>
                <input class="border rounded" type="text" id="password" name="password"> <br>
                <input class="rounded bg-neutral-400 px-2 py-1 font-semibold cursor-pointer hover:bg-neutral-300" type="submit" value="Login">
            </form>
        </div>
    </body>
</html>
